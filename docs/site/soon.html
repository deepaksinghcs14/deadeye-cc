<html lang="en">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181C; --slate:#1B2127; --raised:#232B32; --line:#2E383F;
  --bone:#ECE6D8; --mute:#8B959C; --mute-dim:#5B646B;
  --brass:#C89A46; --brass-dim:#8A6A2E; --brass-glow:rgba(200,154,70,.14);
  --rust:#B15C46; --verd:#7BA090;
  --shadow:0 1px 0 rgba(236,230,216,.04);
  --radius:3px;
}
@media (prefers-color-scheme: light){
  :root{
    --ink:#F3EFE4; --slate:#FFFFFF; --raised:#FBF9F2; --line:#DCD4C0;
    --bone:#20241F; --mute:#6B6255; --mute-dim:#9A9284;
    --brass:#9A6B1E; --brass-dim:#B9924A; --brass-glow:rgba(154,107,30,.10);
    --rust:#A2432D; --verd:#3F7A63;
  }
}
:root[data-theme="dark"]{
  --ink:#14181C; --slate:#1B2127; --raised:#232B32; --line:#2E383F;
  --bone:#ECE6D8; --mute:#8B959C; --mute-dim:#5B646B;
  --brass:#C89A46; --brass-dim:#8A6A2E; --brass-glow:rgba(200,154,70,.14);
  --rust:#B15C46; --verd:#7BA090;
}
:root[data-theme="light"]{
  --ink:#F3EFE4; --slate:#FFFFFF; --raised:#FBF9F2; --line:#DCD4C0;
  --bone:#20241F; --mute:#6B6255; --mute-dim:#9A9284;
  --brass:#9A6B1E; --brass-dim:#B9924A; --brass-glow:rgba(154,107,30,.10);
  --rust:#A2432D; --verd:#3F7A63;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--bone);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
a{color:var(--brass);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
code{font-family:"IBM Plex Mono",monospace;background:var(--brass-glow);padding:1px 5px;border-radius:2px;font-size:.92em}

/* ---------- structural type ---------- */
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--brass-dim);margin:0 0 14px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--brass-dim)}
h2{
  font-family:"Saira Condensed",sans-serif;font-weight:700;
  font-size:clamp(28px,4vw,44px);letter-spacing:.01em;line-height:1.05;
  margin:0 0 10px;text-transform:uppercase;text-wrap:balance;
}
h3{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:20px;
  text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.lede{color:var(--mute);max-width:62ch;margin:0 0 34px}
section{padding:88px 0;position:relative}
section:not(.hero-section)::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 22px);
}

/* ---------- reveal-on-scroll ---------- */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* ---------- nav ---------- */
.nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 0;font-family:"IBM Plex Mono",monospace;font-size:13px;
}
.nav .brand{color:var(--bone);font-weight:600;letter-spacing:.06em;display:inline-flex;align-items:center;gap:9px}
.brand-mark{height:22px;width:auto;flex:none;display:block}
.nav-links{display:flex;gap:22px}
.nav-links a{color:var(--mute)}
.nav-links a:hover{color:var(--brass);text-decoration:none}

/* ---------- hero ---------- */
.hero-section{padding:60px 0 20px}
.hero-section::before{display:none}
.hero-top{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.hero h1{
  font-family:"Saira Condensed",sans-serif;font-weight:700;
  font-size:clamp(64px,10vw,148px);line-height:.82;letter-spacing:-.01em;
  margin:0 0 18px;text-transform:lowercase;
}
.hero h1 .dot{color:var(--brass);display:inline-block;animation:pulseDot 3.2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.hero h1 .dot{animation:none}}
.tagline{
  font-family:"Saira Condensed",sans-serif;font-weight:700;
  font-size:clamp(20px,3vw,28px);text-transform:uppercase;letter-spacing:.05em;
  margin:0 0 16px;color:var(--brass);
}
.hero p.sub{color:var(--mute);max-width:54ch;margin:0 0 30px;font-size:17px}

.host-chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 12px;font:500 12px/1 "IBM Plex Mono",monospace;color:var(--bone);background:var(--raised)}
.chip .k{color:var(--mute)}
.chip svg{display:block;fill:var(--bone)}
.chip.claude{border-color:rgba(217,119,87,.45)}
.chip.claude svg{fill:#D97757}

.install{
  display:inline-flex;flex-direction:column;gap:8px;
  background:var(--slate);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 20px;font-family:"IBM Plex Mono",monospace;font-size:13.5px;
  margin-bottom:14px;position:relative;
}
.install::before{content:"INSTALL";position:absolute;top:-9px;left:16px;background:var(--ink);
  padding:0 8px;font-size:9.5px;letter-spacing:.2em;color:var(--brass-dim)}
.install .l{white-space:nowrap;overflow-x:auto}
.install .p{color:var(--brass);user-select:none}
.note{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mute-dim)}

/* ---------- hero art (the deadeye mark) ---------- */
.hero-art{position:relative;display:flex;align-items:center;justify-content:center}
.hero-art svg{width:100%;max-width:280px;height:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))}
.hero-art .ring{position:absolute;inset:0;margin:auto;width:112%;max-width:320px;aspect-ratio:1;
  border:1px solid var(--brass-dim);border-radius:50%;opacity:.28;
  animation:driftRing 120s linear infinite;pointer-events:none}
@keyframes driftRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hero-art .ring{animation:none}}

/* theme-swap: shared by the hero mark and the nav mark -- shows whichever
   variant (dark lines on light bg / light lines on dark bg) matches the
   current theme, same precedence order as the color tokens: OS preference,
   then an explicit data-theme override. */
.art-light{display:none}
@media (prefers-color-scheme:light){
  .art-dark{display:none}
  .art-light{display:block}
}
:root[data-theme="light"] .art-dark{display:none}
:root[data-theme="light"] .art-light{display:block}
:root[data-theme="dark"] .art-dark{display:block}
:root[data-theme="dark"] .art-light{display:none}

/* ---------- signature: token field ---------- */
.field{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  margin-top:48px;background:var(--slate);
}
.panel{padding:22px 24px 26px;position:relative}
.panel + .panel{border-left:1px solid var(--line)}
.panel-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;margin-bottom:16px;
}
.panel-head .who{color:var(--mute)}
.bracket{position:relative;display:inline-flex;padding:2px 10px;font-variant-numeric:tabular-nums}
.bracket::before,.bracket::after{content:"";position:absolute;top:0;bottom:0;width:7px;border-color:currentColor;border-style:solid}
.bracket::before{left:0;border-width:1.5px 0 1.5px 1.5px}
.bracket::after{right:0;border-width:1.5px 1.5px 1.5px 0}
.before .bracket{color:var(--rust);font-size:19px;font-weight:600}
.after .bracket{color:var(--verd);font-size:19px;font-weight:600}
.ticks{height:210px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.tick{height:2px;background:var(--rust);opacity:.42;border-radius:1px}
.after .ticks{gap:0;justify-content:flex-start}
.real{
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.85;
  color:var(--bone);white-space:pre;overflow-x:auto;
}
.real .f{color:var(--rust);font-weight:600}
.real .d{color:var(--mute)}
.caption{
  margin-top:16px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--mute-dim);
}
.field-foot{
  grid-column:1/-1;border-top:1px solid var(--line);padding:14px 24px;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mute);
  background:var(--ink);
}
.field-foot b{color:var(--bone);font-weight:600}

/* ---------- turret dial (ordered process) ---------- */
.dial{list-style:none;padding:0;margin:0;counter-reset:click}
.dial li{
  padding:20px 0 20px 54px;border-bottom:1px solid var(--line);position:relative;
  counter-increment:click;
}
.dial li:first-child{padding-top:0}
.dial li:last-child{border-bottom:none;padding-bottom:0}
.dial li::before{
  content:counter(click);position:absolute;left:0;top:20px;
  width:34px;height:34px;border:1px solid var(--brass-dim);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--brass);
  background:var(--brass-glow);
}
.dial li:first-child::before{top:0}
.dial b{
  font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:17px;
  text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;
}
.dial span{color:var(--mute);font-size:14.5px}

/* ---------- range card ---------- */
.card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card-top{
  background:var(--slate);padding:12px 20px;border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--brass-dim);
  display:flex;justify-content:space-between;
}
table{width:100%;border-collapse:collapse}
td,th{padding:16px 20px;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--line);font-size:15px}
tr:last-child td{border-bottom:none}
th{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute);font-weight:500;padding-bottom:10px;
}
td.axis{
  font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:18px;
  text-transform:uppercase;letter-spacing:.04em;width:24%;white-space:nowrap;
}
td.desc{color:var(--mute);width:56%}
td.mode{width:20%}
.pill{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:2px;
  border:1px solid var(--brass-dim);color:var(--brass);
}
.pill.soft{border-color:var(--line);color:var(--mute)}

/* ---------- terminal blocks ---------- */
.term{
  background:var(--slate);border:1px solid var(--line);border-radius:var(--radius);
  font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.8;
  padding:20px 22px;overflow-x:auto;white-space:pre;color:var(--bone);position:relative;
}
.term::before{content:"● ● ●";position:absolute;top:9px;right:15px;font-size:8px;
  letter-spacing:3px;color:var(--line)}
.term .c{color:var(--brass)}
.term .m{color:var(--mute)}
.term .g{color:var(--verd)}
.term .r{color:var(--rust)}

/* ---------- two col ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.rules{list-style:none;padding:0;margin:0}
.rules li{padding:18px 0;border-bottom:1px solid var(--line)}
.rules li:first-child{padding-top:0}
.rules li:last-child{border-bottom:none}
.rules b{
  font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:17px;
  text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px;
}
.rules span{color:var(--mute);font-size:14.5px}

/* ---------- faq ---------- */
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq details:first-child{padding-top:0}
.faq summary{
  cursor:pointer;font-family:"Saira Condensed",sans-serif;font-weight:700;
  font-size:19px;text-transform:uppercase;letter-spacing:.03em;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brass);font-size:22px;line-height:1;flex:none}
.faq details[open] summary::after{content:"−"}
.faq p{color:var(--mute);margin:12px 0 0;max-width:70ch}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:44px 0 64px;color:var(--mute);
  font-family:"IBM Plex Mono",monospace;font-size:13px}
.pair{
  display:flex;gap:14px;align-items:center;margin-bottom:22px;flex-wrap:wrap;
}
.pair .tool{
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;
  background:var(--slate);flex:1;min-width:230px;
}
.pair .tool b{color:var(--bone);display:block;font-weight:600;font-family:"Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:15px}
.pair .tool span{font-size:12px;display:block;margin-top:4px;line-height:1.6}

@media(max-width:820px){
  .field{grid-template-columns:1fr}
  .panel + .panel{border-left:none;border-top:1px solid var(--line)}
  .two{grid-template-columns:1fr;gap:40px}
  section{padding:64px 0}
  td.axis,td.desc,td.mode{width:auto;display:block;border-bottom:none;padding:4px 20px}
  td.axis{padding-top:18px}
  td.mode{padding-bottom:18px}
  tr{display:block;border-bottom:1px solid var(--line)}
  thead{display:none}
  .ticks{height:150px}
  .hero-top{grid-template-columns:1fr;gap:8px}
  .hero-art{order:-1;max-width:200px;margin:0 auto 8px}
}
@media(max-width:640px){
  .nav{flex-wrap:wrap;justify-content:center;gap:12px;text-align:center}
  .nav-links{flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px}
  .install .l{white-space:normal;word-break:break-all;overflow-x:visible}
  .card-top{flex-direction:column;align-items:flex-start;gap:4px}
  .hero-art{max-width:150px}
}
@media(prefers-reduced-motion:no-preference){
  .tick{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateX(-6px)}to{opacity:.42}}
}

/* redesign: USP grid (data-forward) */
.usp{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:8px}
.usp-card{background:var(--slate);padding:26px 24px}
.usp-stat{display:block;font-family:"Saira Condensed",sans-serif;font-weight:700;
  font-size:clamp(30px,3.4vw,42px);line-height:1;color:var(--brass);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.usp-card b{display:block;font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);
  margin:12px 0 10px}
.usp-card p{color:var(--mute);font-size:14px;margin:0;line-height:1.6}
@media(max-width:820px){.usp{grid-template-columns:1fr}}
@media(min-width:821px) and (max-width:1000px){.usp{grid-template-columns:repeat(2,1fr)}}
/* redesign: deep-dive expanders under the comparison */
.deep-set details{border-bottom:1px solid var(--line)}
.deep-set summary{font-size:22px}
.deep-body{margin-top:22px}
.deep-body .two{margin-top:0}
.deep-body .two + .two{margin-top:28px}
.deep-body .lede{margin-bottom:24px}

/* redesign: clickable host chips -> README install anchors */
a.chip{transition:border-color .15s ease}
a.chip:hover{border-color:var(--brass);text-decoration:none}
a.chip:hover .k{color:var(--brass-dim)}

/* ---------- soon / waitlist page ---------- */
body.soon-body{display:flex;min-height:100vh;flex-direction:column}
.soon{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.banner{width:100%;max-width:1040px;border:1px solid var(--line);border-radius:10px;
  background:var(--slate);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.bar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--mute)}
.bar .dots{display:inline-flex;gap:7px}
.bar .dots i{width:11px;height:11px;border-radius:50%;display:block}
.bar .dots i:nth-child(1){background:#E06C5A}
.bar .dots i:nth-child(2){background:#E0B54A}
.bar .dots i:nth-child(3){background:#7BA090}
.banner-grid{display:grid;grid-template-columns:290px 1fr;gap:36px;align-items:center;padding:48px 52px}
.banner-art{display:flex;justify-content:center}
.banner-art svg{width:100%;max-width:240px;height:auto;filter:drop-shadow(0 16px 34px rgba(0,0,0,.35))}
.kick{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--brass);margin:0 0 16px;display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brass);
  box-shadow:0 0 0 4px var(--brass-glow)}
.banner-copy h1{font-family:"Saira Condensed",sans-serif;font-weight:700;
  font-size:clamp(34px,5vw,58px);line-height:.98;text-transform:uppercase;letter-spacing:.01em;
  margin:0 0 14px;text-wrap:balance}
.subline{color:var(--mute);font-size:18px;margin:0 0 30px}
.wl{display:flex;gap:10px;flex-wrap:wrap;max-width:480px}
.wl input{flex:1;min-width:210px;background:var(--ink);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 15px;color:var(--bone);
  font-family:"IBM Plex Mono",monospace;font-size:14px}
.wl input::placeholder{color:var(--mute-dim)}
.wl input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-glow)}
.wl button{background:#C89A46;color:#161616;border:none;border-radius:var(--radius);
  padding:14px 24px;font-family:"Saira Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:15px;cursor:pointer;white-space:nowrap;transition:filter .15s,transform .1s}
.wl button:hover{filter:brightness(1.07)}
.wl button:active{transform:translateY(1px)}
.wl button:disabled{opacity:.6;cursor:default}
.wl-msg{font-family:"IBM Plex Mono",monospace;font-size:13px;margin:18px 0 0;display:none}
.wl-ok{color:var(--verd)}
.wl-err{color:var(--rust)}
.wl-note{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mute-dim);margin:16px 0 0}
.soon-foot{text-align:center;padding:26px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mute-dim)}
.soon-foot a{color:var(--mute)}
@media(max-width:720px){
  .banner-grid{grid-template-columns:1fr;text-align:center;padding:34px 26px;gap:22px}
  .banner-art{order:-1}.banner-art svg{max-width:148px}
  .kick{justify-content:center}.wl{margin:0 auto}
}
</style>

</head>
<body class="soon-body">

  <script>
  (function(){
    var f=document.querySelector('.wl');
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var btn=f.querySelector('button'),ok=document.querySelector('.wl-ok'),err=document.querySelector('.wl-err');
      err.style.display='none';btn.disabled=true;var label=btn.innerHTML;btn.textContent='Sending\u2026';
      fetch(f.action,{method:'POST',body:new FormData(f),headers:{'Accept':'application/json'}})
        .then(function(r){ if(r.ok){f.style.display='none';ok.style.display='block';} else {throw 0;} })
        .catch(function(){ btn.disabled=false;btn.innerHTML=label;err.style.display='block'; });
    });
  })();
  </script>
