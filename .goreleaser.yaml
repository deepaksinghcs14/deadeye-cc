version: 2

builds:
  - id: deadeye
    main: ./cmd/deadeye
    binary: deadeye
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/deepaksinghcs14/deadeye-cc/internal/meta.Version={{.Version}}

# Raw binaries, not archives -- hooks/bootstrap.sh downloads
# deadeye_<os>_<arch> directly and sha256-verifies it against checksums.txt.
# goreleaser appends .exe to the windows artifact automatically.
archives:
  - id: deadeye
    formats: [binary]
    name_template: "deadeye_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
