name: pages

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "schema/**"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "docs/site/**"
      - "schema/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check site exists
        run: test -f docs/site/index.html

      - name: Validate hosted catalog
        run: |
          test -f docs/site/catalog.json
          jq empty docs/site/catalog.json

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site

  deploy:
    # Deploy only on push to main -- PRs touching the site just build to
    # confirm it isn't broken. Originally gated on release tags (PLAN.md
    # §12.1), but tag refs hit the github-pages environment's deployment
    # protection rules by default (only branches are allowed unless a tag
    # pattern is added there explicitly) -- deploying off main instead
    # sidesteps that with no repo settings change required.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Note: the first deploy after enabling Pages reported success via the
    # API but served a stale negative-cached 404 at the actual URL.
    # Disabling and re-enabling the Pages source, then redeploying, is what
    # cleared it.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
