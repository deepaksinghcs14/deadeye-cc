name: pages

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "schema/**"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "docs/site/**"
      - "schema/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check site exists
        run: test -f docs/site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    # Deploy only on push to main -- PRs touching the site just build to
    # confirm it isn't broken. Originally gated on release tags (PLAN.md
    # §12.1), but tag refs hit the github-pages environment's deployment
    # protection rules by default (only branches are allowed unless a tag
    # pattern is added there explicitly) -- deploying off main instead
    # sidesteps that with no repo settings change required.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
