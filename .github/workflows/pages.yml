name: pages

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "schema/**"
      - ".github/workflows/pages.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check site exists
        run: test -f docs/site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    # Deploy only on release tags -- PRs touching the site just build to
    # confirm it isn't broken (PLAN.md §12.1).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
